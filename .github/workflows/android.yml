name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets are unavailable to pull requests from forks; signing steps are skipped then.
      HAS_KEYSTORE: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Validates the Gradle wrapper and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mjolnir-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          MJOLNIR_KEYSTORE_BASE64: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 }}
        run: echo "$MJOLNIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mjolnir-release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          MJOLNIR_KEYSTORE_FILE: ${{ runner.temp }}/mjolnir-release.jks
          MJOLNIR_KEYSTORE_PASSWORD: ${{ secrets.MJOLNIR_KEYSTORE_PASSWORD }}
          MJOLNIR_KEY_ALIAS: ${{ secrets.MJOLNIR_KEY_ALIAS }}
          MJOLNIR_KEY_PASSWORD: ${{ secrets.MJOLNIR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mjolnir-${version}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "dist/mjolnir-${version}.apk"

      - name: Remove release keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/mjolnir-release.jks"

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mjolnir-release-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

    outputs:
      signed: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 != '' }}

  # Pushing a tag such as v0.2.8 publishes a GitHub Release with the signed APK.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mjolnir-release-${{ github.sha }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

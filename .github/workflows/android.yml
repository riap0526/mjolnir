name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.2.8). Must match versionName. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

# A newer push supersedes an older build of the same branch, but a release run (manual or tag)
# is never cancelled: separate group per event, and no cancellation for releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets are unavailable to pull requests from forks; signing steps are skipped then.
      HAS_KEYSTORE: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Validates the Gradle wrapper and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mjolnir-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Report only: the existing code still has lint errors (see docs/TODO.md #27). The step is
      # marked failed when lint finds errors, but it does not fail the job or block a release.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          MJOLNIR_KEYSTORE_BASE64: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 }}
        run: echo "$MJOLNIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mjolnir-release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          MJOLNIR_KEYSTORE_FILE: ${{ runner.temp }}/mjolnir-release.jks
          MJOLNIR_KEYSTORE_PASSWORD: ${{ secrets.MJOLNIR_KEYSTORE_PASSWORD }}
          MJOLNIR_KEY_ALIAS: ${{ secrets.MJOLNIR_KEY_ALIAS }}
          MJOLNIR_KEY_PASSWORD: ${{ secrets.MJOLNIR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mjolnir-${version}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "dist/mjolnir-${version}.apk"

      - name: Remove release keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/mjolnir-release.jks"

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mjolnir-release-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

    outputs:
      signed: ${{ secrets.MJOLNIR_KEYSTORE_BASE64 != '' }}

  # Publishes a GitHub Release with the signed APK, either when a v* tag is pushed or when the
  # workflow is run manually with release_tag set (the tag is then created on the built commit).
  release:
    needs: build
    if: >-
      needs.build.outputs.signed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches versionName and has release notes
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match versionName $version" >&2
            exit 1
          fi
          # Release notes come from the in-app changelog of that version.
          test -f "app/src/main/assets/changelogs/$RELEASE_TAG.txt"

      - uses: actions/download-artifact@v4
        with:
          name: mjolnir-release-${{ github.sha }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Mjolnir ${{ env.RELEASE_TAG }}
          files: dist/*.apk
          body_path: app/src/main/assets/changelogs/${{ env.RELEASE_TAG }}.txt
          fail_on_unmatched_files: true
